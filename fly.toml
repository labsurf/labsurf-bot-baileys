app = "labsurf-bot-baileys"  # El nombre que elegiste
primary_region = "iad"

[build]
  [build.args]
    NODE_VERSION = "20"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[processes]
  app = "node index.js"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "baileys_data"
  destination = "/app/baileys_auth"
  processes = ["app"]